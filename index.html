<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AG PILOT CAL</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b5e20">

<style>

body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial, Helvetica, sans-serif;
}

.container{
    max-width:900px;
    margin:auto;
    padding:15px;
}

.header img{
    width:100%;
    max-height:260px;
    object-fit:cover;
    border-radius:12px;
}

.titulo{
    text-align:center;
    margin:15px 0;
}

.titulo h1{
    margin:0;
    font-size:48px;
}

.titulo p{
    margin-top:10px;
    font-size:22px;
}

.card{
    background:#1e1e1e;
    padding:18px;
    border-radius:12px;
    margin-top:15px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:8px;
    font-size:20px;
}

select,input{
    width:100%;
    padding:14px;
    font-size:22px;
    border-radius:10px;
    border:none;
    box-sizing:border-box;
}

.btn{
    width:100%;
    padding:16px;
    margin-top:15px;
    font-size:22px;
    font-weight:bold;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

.calcular{
    background:#f4d130;
    color:black;
}

.reiniciar{
    background:#3a3a3a;
    color:white;
}

.resultado{
    display:none;
}

.box{
    background:#263238;
    padding:15px;
    border-radius:10px;
    margin-top:12px;
}

.success{
    color:#4caf50;
    font-weight:bold;
}

.warning{
    color:#ff9800;
    font-weight:bold;
}

.referencia{
    width:100%;
    border-radius:10px;
    margin-top:15px;
}

.footer{
    text-align:center;
    margin-top:25px;
    color:#cccccc;
    font-size:16px;
}

.footer hr{
    margin-bottom:20px;
}

</style>
</head>

<body>

<div class="container">

<div class="header">
    portada.jpg
</div>

<div class="titulo">
<h1>AG PILOT CAL</h1>
<p>By Pablo Ortiz</p>
</div>

<div class="card">

<label>Espaciamiento entre surcos (cm)</label>

<select id="surco">

<option value="0.175">17,5</option>
<option value="0.19">19</option>
<option value="0.20">20</option>
<option value="0.21">21</option>
<option value="0.26">26</option>
<option value="0.35">35</option>
<option value="0.38">38</option>
<option value="0.40">40</option>
<option value="0.42">42</option>
<option value="0.525" selected>52,5</option>
<option value="0.63">63</option>
<option value="0.70">70</option>
<option value="0.762">76,2</option>
<option value="0.80">80</option>
<option value="0.90">90</option>
<option value="1.00">100</option>

</select>

<label>Medida Izquierda (m)</label>

<input
id="izq"
type="number"
step="0.001"
placeholder="Ej: 0.71">

<label>Medida Derecha (m)</label>

<input
id="der"
type="number"
step="0.001"
placeholder="Ej: 0.34">

<button class="btn calcular" onclick="calcular()">
CALCULAR
</button>

<button class="btn reiniciar" onclick="reiniciar()">
REINICIAR
</button>

</div>

<div class="card resultado" id="resultado">

<h2>Diagnóstico</h2>

<div id="estado"></div>

<div class="box">

<h3>Corrección Valor C</h3>

<div id="valorc"></div>

<br>

✅ Compensar SIEMPRE hacia el lado más cerrado

<div id="direccion"></div>

</div>

<div class="box">

<h3>Corrección Ancho de Apero</h3>

<div id="ancho"></div>

</div>

<img srcia.png

</div>

<div class="footer">

<hr>

<b>Contacto</b>

<br><br>

Pablo Ortiz

<br><br>

📞 03583 486922

<br><br>

📧 pabloortiz01@hotmail.com

<br><br>

AG PILOT CAL

</div>

</div>

<script>

function calcular(){

let surco =
parseFloat(
document.getElementById("surco").value
);

let izq =
parseFloat(
document.getElementById("izq").value
);

let der =
parseFloat(
document.getElementById("der").value
);

if(isNaN(izq) || isNaN(der)){

alert("Ingrese ambas mediciones");

return;

}

let teorico = surco * 2;

let suma = izq + der;

let valorC =
Math.abs(izq - der) / 4;

let direccion="";

if(izq > der){

direccion =
"➡ Mover hacia la DERECHA";

}else if(der > izq){

direccion =
"⬅ Mover hacia la IZQUIERDA";

}else{

direccion =
"Sin corrección";

}

let correccionApero =
(teorico - suma) / 2;

if(Math.abs(teorico - suma) <= 0.02){

document.getElementById("estado").innerHTML =
'<span class="success">🟢 APERO CENTRADO</span>';

}else{

document.getElementById("estado").innerHTML =
'<span class="warning">⚠ VERIFICAR CENTRADO</span>';

}

document.getElementById("valorc").innerHTML =
valorC.toFixed(2) + " m";

document.getElementById("direccion").innerHTML =
direccion;

if(correccionApero > 0){

document.getElementById("ancho").innerHTML =
"⬆ AUMENTAR " +
correccionApero.toFixed(2) +
" m";

}else if(correccionApero < 0){

document.getElementById("ancho").innerHTML =
"⬇ REDUCIR " +
Math.abs(correccionApero).toFixed(2) +
" m";

}else{

document.getElementById("ancho").innerHTML =
"✅ Sin corrección";

}

document.getElementById("resultado")
.style.display = "block";

}

function reiniciar(){

document.getElementById("izq").value="";
document.getElementById("der").value="";

document.getElementById("resultado")
.style.display="none";

}

if("serviceWorker" in navigator){

navigator.serviceWorker.register(
"service-worker.js"
);

}

</script>

</body>
</html>
